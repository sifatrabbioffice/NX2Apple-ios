name: Build NX2Apple IPA (iPhone 15 Pro Max)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # সঠিক রানার যা গিটহাব অটোমেটিক প্রোভাইড করে

    steps:
      - name: Checkout NX2Apple Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Python & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Project Archive
        run: |
          if [ -f "NX2Apple.xcodeproj" ]; then
            xcodebuild archive \
              -project NX2Apple.xcodeproj \
              -scheme NX2Apple \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath $RUNNER_TEMP/NX2Apple.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          elif [ -f "NX2Apple.xcworkspace" ]; then
            xcodebuild archive \
              -workspace NX2Apple.xcworkspace \
              -scheme NX2Apple \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath $RUNNER_TEMP/NX2Apple.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "Standard Xcode project file not found. Running custom python build script if applicable."
          fi

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          if [ -d "$RUNNER_TEMP/NX2Apple.xcarchive/Products/Applications" ]; then
            cp -r $RUNNER_TEMP/NX2Apple.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
            cd $RUNNER_TEMP
            zip -r NX2Apple_iPhone15ProMax.ipa Payload
            mv NX2Apple_iPhone15ProMax.ipa $GITHUB_WORKSPACE/
          else
            echo "No .app bundle generated to package."
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX2Apple-iPhone15ProMax-Unsigned-IPA
          path: NX2Apple_iPhone15ProMax.ipa
          retention-days: 7
